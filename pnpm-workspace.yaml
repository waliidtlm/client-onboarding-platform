packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

overrides:
  "next>postcss": "8.5.23"
  "next>sharp": "0.35.3"

minimumReleaseAgeExclude:
  - "@prisma/adapter-pg@7.9.1"
  - "@prisma/client-runtime-utils@7.9.1"
  - "@prisma/client@7.9.1"
  - "@prisma/config@7.9.1"
  - "@prisma/debug@7.9.1"
  - "@prisma/dev@0.24.17"
  - "@prisma/driver-adapter-utils@7.9.1"
  - "@prisma/engines@7.9.1"
  - "@prisma/fetch-engine@7.9.1"
  - "@prisma/get-platform@7.9.1"
  - prisma@7.9.1
