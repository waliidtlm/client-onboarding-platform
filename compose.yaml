name: client-onboarding-platform

services:
  postgres:
    image: postgres:18.4-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD}
      TEST_DB_NAME: ${TEST_DB_NAME}
      TEST_DB_USER: ${TEST_DB_USER}
      TEST_DB_PASSWORD: ${TEST_DB_PASSWORD}
      SHADOW_DB_NAME: ${SHADOW_DB_NAME}
      N8N_DB_NAME: ${N8N_DB_NAME}
      N8N_DB_USER: ${N8N_DB_USER}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
      - ./docker/postgres/init/02-phase1-databases.sh:/docker-entrypoint-initdb.d/02-phase1-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  db-bootstrap:
    image: postgres:18.4-alpine3.24
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_USER: ${APP_DB_USER}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD}
      TEST_DB_NAME: ${TEST_DB_NAME}
      TEST_DB_USER: ${TEST_DB_USER}
      TEST_DB_PASSWORD: ${TEST_DB_PASSWORD}
      SHADOW_DB_NAME: ${SHADOW_DB_NAME}
      N8N_DB_NAME: ${N8N_DB_NAME}
      N8N_DB_USER: ${N8N_DB_USER}
    volumes:
      - ./docker/postgres/init/02-phase1-databases.sh:/bootstrap/02-phase1-databases.sh:ro
    command: ["sh", "/bootstrap/02-phase1-databases.sh"]
    restart: "no"

  migrate:
    image: client-onboarding-platform-migrate:0.1.0
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: migrator
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${MIGRATION_DB_USER}:${MIGRATION_DB_PASSWORD}@postgres:5432/${APP_DB_NAME}
    restart: "no"

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.32.5
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME}
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      DB_POSTGRESDB_SCHEMA: public
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto,http,https
      AUTOMATION_API_BASE_URL: http://web:3000
      AUTOMATION_SERVICE_TOKEN: ${AUTOMATION_SERVICE_TOKEN}
      AUTOMATION_HMAC_SECRET: ${AUTOMATION_HMAC_SECRET}
      AUTOMATION_WORKER_ID: ${AUTOMATION_WORKER_ID:-n8n-local-primary}
      AUTOMATION_PHASE5_SERVICE_TOKEN: ${AUTOMATION_PHASE5_SERVICE_TOKEN}
      AUTOMATION_PHASE5_HMAC_SECRET: ${AUTOMATION_PHASE5_HMAC_SECRET}
      AUTOMATION_PHASE5_WORKER_ID: ${AUTOMATION_PHASE5_WORKER_ID:-n8n-local-client-access}
      GENERIC_TIMEZONE: Africa/Casablanca
      TZ: Africa/Casablanca
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./automation/n8n/workflows:/workflows:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5678/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.27.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:${WEB_PORT:-3000}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${OBJECT_STORAGE_BUCKET}
      MINIO_APP_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      MINIO_APP_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      APP_PUBLIC_ORIGIN: http://127.0.0.1:${WEB_PORT:-3000}
    volumes:
      - ./docker/minio/bootstrap.sh:/bootstrap/bootstrap.sh:ro
    entrypoint: ["sh", "/bootstrap/bootstrap.sh"]
    restart: "no"

  web:
    image: client-onboarding-platform-web:0.1.0
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-bootstrap:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${APP_DB_NAME}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTOMATION_SERVICE_TOKEN: ${AUTOMATION_SERVICE_TOKEN}
      AUTOMATION_HMAC_SECRET: ${AUTOMATION_HMAC_SECRET}
      AUTOMATION_PHASE5_SERVICE_TOKEN: ${AUTOMATION_PHASE5_SERVICE_TOKEN}
      AUTOMATION_PHASE5_HMAC_SECRET: ${AUTOMATION_PHASE5_HMAC_SECRET}
      AUTOMATION_SIGNATURE_MAX_AGE_SECONDS: ${AUTOMATION_SIGNATURE_MAX_AGE_SECONDS:-300}
      AUTOMATION_LEASE_SECONDS: ${AUTOMATION_LEASE_SECONDS:-300}
      AUTOMATION_MAX_ATTEMPTS: ${AUTOMATION_MAX_ATTEMPTS:-5}
      AUTOMATION_RETRY_BASE_SECONDS: ${AUTOMATION_RETRY_BASE_SECONDS:-30}
      PROVISIONING_TASK_MAX_ATTEMPTS: ${PROVISIONING_TASK_MAX_ATTEMPTS:-3}
      NEXTAUTH_URL: http://127.0.0.1:${WEB_PORT:-3000}
      CLIENT_ACCESS_ACTIVE_SIGNING_KEY_VERSION: ${CLIENT_ACCESS_ACTIVE_SIGNING_KEY_VERSION}
      CLIENT_ACCESS_SIGNING_KEYS: ${CLIENT_ACCESS_SIGNING_KEYS}
      CLIENT_ACCESS_TOKEN_DAYS: ${CLIENT_ACCESS_TOKEN_DAYS:-30}
      CLIENT_ACCESS_PUBLIC_BASE_URL: http://127.0.0.1:${WEB_PORT:-3000}/client-access
      APP_PUBLIC_ORIGIN: http://127.0.0.1:${WEB_PORT:-3000}
      CLIENT_SESSION_SECRET: ${CLIENT_SESSION_SECRET}
      PUBLIC_RATE_LIMIT_HMAC_SECRET: ${PUBLIC_RATE_LIMIT_HMAC_SECRET}
      TRUSTED_PROXY_HOPS: 1
      AGENCY_NAME: ${AGENCY_NAME:-Northstar Growth Agency}
      CLIENT_SUPPORT_CONTACT: ${CLIENT_SUPPORT_CONTACT}
      OBJECT_STORAGE_INTERNAL_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BROWSER_ENDPOINT: http://127.0.0.1:${MINIO_API_PORT:-9000}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  proxy:
    image: nginx:1.29.5-alpine3.23
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:8080"
    volumes:
      - ./docker/proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
  n8n_data:
  minio_data:
